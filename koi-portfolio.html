<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Yuri Ante · Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #f4efe2;
        --dim: #9db8ae;
        --bg: #04100f;
        --panel: #071a19;
        --line: #2a8a78;
        --shadow: #020a09;
        --pix: "Pixelify Sans", "Courier New", monospace;
        --paper: #f1e5c7;
        --paper-edge: #bda77b;
        --paper-ink: #293b30;
        --paper-dim: #59604a;
        --paper-rule: #b6a57f;
        --wood: #67482f;
        --wood-edge: #a17a4a;
        --wood-dark: #302b20;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--pix);
      }
      #pond {
        position: fixed;
        left: 0;
        top: 0;
        image-rendering: crisp-edges;
        image-rendering: pixelated;
        touch-action: manipulation;
        cursor: pointer;
      }
      .hdr {
        position: fixed;
        left: 0;
        top: 0;
        pointer-events: none;
        text-shadow:
          2px 2px 0 var(--shadow),
          0 0 14px var(--shadow);
        padding: calc(18px + env(safe-area-inset-top, 0px)) 22px 0
          calc(22px + env(safe-area-inset-left, 0px));
      }
      h1 {
        margin: 0;
        font-size: clamp(26px, 5vw, 44px);
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      .hdr p {
        margin: 4px 0 0;
        color: var(--dim);
        font-size: clamp(13px, 2vw, 17px);
      }
      .hint {
        position: fixed;
        left: 0;
        right: 0;
        bottom: calc(16px + env(safe-area-inset-bottom, 0px));
        text-align: center;
        color: var(--dim);
        font-size: 15px;
        pointer-events: none;
        text-shadow: 2px 2px 0 var(--shadow);
        transition: opacity 1.2s;
      }
      .hint.done {
        opacity: 0.35;
      }
      #tip {
        position: fixed;
        z-index: 3;
        pointer-events: none;
        padding: 5px 9px;
        background: var(--panel);
        border: 2px solid var(--line);
        box-shadow: 3px 3px 0 var(--shadow);
        font-size: 14px;
        white-space: nowrap;
        opacity: 0;
        transition: opacity 0.12s;
      }
      #tip.on {
        opacity: 1;
      }
      #tip small {
        display: block;
        color: var(--dim);
        font-size: 11px;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        margin: 0;
        padding: 0;
      }
      @media (prefers-reduced-motion: reduce) {
        .hint,
        #tip {
          transition: none;
        }
      }
      /* Project UI stays at native resolution while the pond camera stays pixelated. */
      button,
      select,
      a {
        font: inherit;
      }
      button,
      select {
        min-height: 44px;
        border: 1px solid var(--line);
        border-radius: 0;
        background: var(--panel);
        color: var(--ink);
        padding: 10px 14px;
      }
      button {
        cursor: pointer;
      }
      button:hover {
        background: #12362e;
      }
      :focus-visible {
        outline: 3px solid #f2d35b;
        outline-offset: 4px;
      }
      [hidden] {
        display: none !important;
      }
      /* Pocket notebook: only its cover moves; the readable page remains flat. */
      .project-picker {
        position: fixed;
        inset: 0;
        z-index: 4;
        pointer-events: none;
      }
      .project-picker button,
      .pocket-sheet {
        pointer-events: auto;
      }
      .journal-trigger {
        position: absolute;
        left: -32px;
        bottom: -116px;
        width: 214px;
        height: 232px;
        transform: rotate(-8deg);
        transform-origin: bottom left;
        padding: 0;
        border: 4px solid #303c29;
        background: repeating-linear-gradient(90deg, transparent 0 3px, #d9dab008 3px 4px), #566044;
        color: var(--paper);
        box-shadow:
          inset 14px 0 #394532,
          inset -6px 0 #d6c8a5,
          5px 4px #a59978,
          9px 8px #273328;
        transition: transform 0.18s ease;
      }
      .journal-trigger:hover,
      .journal-trigger:focus-visible {
        background-color: #626d4d;
        transform: rotate(-5deg) translateY(-12px);
      }
      .cover-bookmark {
        position: absolute;
        top: 16px;
        right: -18px;
        background: var(--paper);
        color: var(--paper-ink);
        padding: 12px 18px;
        box-shadow: 3px 3px #263223;
        font-size: 18px;
        transform: rotate(8deg);
      }
      .cover-emblem {
        position: absolute;
        width: 80px;
        height: 48px;
        left: 68px;
        top: 62px;
        image-rendering: pixelated;
      }
      .cover-title {
        position: absolute;
        left: 66px;
        top: 112px;
        font-size: 14px;
        letter-spacing: 0.1em;
        text-align: left;
      }
      .pocket-sheet {
        position: absolute;
        left: 24px;
        bottom: 112px;
        width: min(410px, calc(100vw - 48px));
        max-height: calc(100dvh - 144px);
        display: flex;
        flex-direction: column;
        background: var(--paper);
        color: var(--paper-ink);
        border: 3px solid var(--paper-edge);
        box-shadow:
          4px 0 #cdbb93,
          8px 4px #514d36,
          8px 8px #020a0966;
        transform: translateY(40px);
        opacity: 0;
        transition:
          transform 0.22s ease 0.28s,
          opacity 0.18s ease 0.32s;
        perspective: 1000px;
      }
      .pocket-sheet.is-open {
        transform: translateY(0);
        opacity: 1;
        transition-delay: 0s;
      }
      .pocket-cover {
        position: absolute;
        inset: -3px;
        z-index: 2;
        pointer-events: none;
        transform-origin: left center;
        background: repeating-linear-gradient(90deg, transparent 0 3px, #d9dab008 3px 4px), #566044;
        border: 4px solid #303c29;
        box-shadow: inset 12px 0 #394532;
        transform: rotateY(0);
        opacity: 1;
        transition:
          transform 0.26s ease,
          opacity 0.2s ease;
      }
      .pocket-cover::after {
        content: "POND FIELD NOTES";
        position: absolute;
        top: 36%;
        left: 22%;
        right: 15%;
        text-align: center;
        color: var(--paper);
        font-size: 26px;
        line-height: 1.5;
      }
      .is-open .pocket-cover {
        transform: rotateY(-100deg);
        opacity: 0;
        transition-delay: 0.2s;
      }
      .notebook-page {
        display: flex;
        flex-direction: column;
        min-height: 0;
        opacity: 0;
        transition: opacity 0.12s ease;
      }
      .is-open .notebook-page {
        opacity: 1;
        transition-delay: 0.3s;
      }
      .notebook-heading {
        padding: 16px 18px 12px 28px;
        border-bottom: 1px solid var(--paper-rule);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .notebook-heading h2 {
        font-size: 24px;
        font-weight: 400;
        margin: 0;
      }
      .notebook-heading small {
        display: block;
        font-size: 12px;
        color: var(--paper-dim);
        margin-bottom: 4px;
        letter-spacing: 0.08em;
      }
      .notebook-heading button {
        min-height: 44px;
        background: transparent;
        color: var(--paper-ink);
        border: 1px solid var(--paper-rule);
        padding: 8px;
        font-size: 14px;
      }
      .notebook-heading button:hover {
        background: #dfd0ac;
      }
      .notebook-entries {
        overflow: auto;
        overscroll-behavior: contain;
        min-height: 0;
        padding: 8px 14px 8px 24px;
        background:
          linear-gradient(90deg, transparent 16px, #ab7d6855 16px 17px, transparent 17px),
          repeating-linear-gradient(0deg, transparent 0 27px, #b6a57f33 27px 28px);
        scrollbar-color: var(--paper-edge) var(--paper);
      }
      .index-choice {
        display: flex;
        width: 100%;
        align-items: center;
        gap: 8px;
        min-height: 52px;
        padding: 8px 4px;
        text-align: left;
        border: 0;
        border-bottom: 1px solid #b6a57f88;
        background: transparent;
        color: var(--paper-ink);
        font-size: 17px;
      }
      .index-choice:hover,
      .index-choice[aria-current="true"] {
        background: #dfd0ac;
      }
      .pocket-sheet :focus-visible {
        outline: 3px solid #295e50;
        outline-offset: -3px;
      }
      .index-number {
        font-size: 12px;
        color: var(--paper-dim);
      }
      .index-choice canvas {
        width: 48px;
        height: 29px;
        image-rendering: pixelated;
        flex-shrink: 0;
      }
      .field-note {
        margin: 0;
        padding: 12px 18px 12px 28px;
        border-top: 1px solid var(--paper-rule);
        font-size: 13px;
        line-height: 1.4;
        color: var(--paper-dim);
      }
      .motion-control {
        position: fixed;
        z-index: 4;
        right: 28px;
        top: 24px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        color: #fff1cf;
        border: 3px solid var(--wood-dark);
        font-size: 15px;
        background:
          repeating-linear-gradient(
            0deg,
            transparent 0 7px,
            #3b2e2428 7px 9px,
            transparent 9px 17px
          ),
          var(--wood);
        box-shadow:
          inset 0 2px var(--wood-edge),
          4px 0 var(--wood-dark),
          -4px 0 var(--wood-dark),
          0 4px var(--wood-dark);
        text-shadow: 1px 2px var(--wood-dark);
      }
      .motion-control:hover {
        background-color: #735237;
        border-color: var(--wood-edge);
      }
      .motion-control span {
        white-space: nowrap;
        flex-shrink: 0;
      }
      .motion-state {
        background: var(--paper);
        color: var(--paper-ink);
        padding: 3px 6px;
        font-size: 12px;
        text-shadow: none;
        min-width: 28px;
      }
      .water-mark {
        position: relative;
        width: 24px;
        height: 16px;
        border: 2px solid currentColor;
        clip-path: polygon(
          0 25%,
          16% 25%,
          16% 0,
          84% 0,
          84% 25%,
          100% 25%,
          100% 75%,
          84% 75%,
          84% 100%,
          16% 100%,
          16% 75%,
          0 75%
        );
      }
      .water-mark::after {
        content: "";
        position: absolute;
        inset: 4px;
        border-top: 2px solid currentColor;
      }
      .motion-control[aria-pressed="true"] .water-mark {
        height: 2px;
        border: 0;
        background: currentColor;
        clip-path: none;
      }
      body.calm .journal-trigger,
      body.calm .pocket-sheet,
      body.calm .pocket-cover,
      body.calm .notebook-page {
        transition: none;
      }
      body.calm .journal-trigger:hover,
      body.calm .journal-trigger:focus-visible {
        transform: rotate(-8deg);
      }
      .project-view {
        position: fixed;
        inset: 0;
        z-index: 5;
        pointer-events: none;
      }
      .project-view button,
      .project-view a,
      .project-card {
        pointer-events: auto;
      }
      .back-button {
        position: absolute;
        left: 24px;
        top: 24px;
        padding: 10px 18px;
        color: #fff1cf;
        border: 3px solid var(--wood-dark);
        background:
          repeating-linear-gradient(
            0deg,
            transparent 0 7px,
            #3b2e241f 7px 9px,
            transparent 9px 17px
          ),
          var(--wood);
        box-shadow:
          inset 0 2px var(--wood-edge),
          inset 0 -3px #493421,
          4px 0 var(--wood-dark),
          -4px 0 var(--wood-dark),
          0 4px var(--wood-dark);
        text-shadow: 1px 2px #30251c;
      }
      .back-button:hover {
        background-color: #735237;
        border-color: var(--wood-edge);
        box-shadow:
          inset 0 2px #c29b67,
          inset 0 -3px #493421,
          4px 0 var(--wood-dark),
          -4px 0 var(--wood-dark),
          0 4px var(--wood-dark);
      }
      .back-arrow {
        display: inline-block;
        width: 14px;
        height: 12px;
        margin-right: 10px;
        background: currentColor;
        clip-path: polygon(0 50%, 40% 0, 40% 32%, 100% 32%, 100% 68%, 40% 68%, 40% 100%);
        vertical-align: -1px;
      }
      .focus-caption {
        position: absolute;
        left: 6%;
        bottom: 20%;
        width: 36%;
        text-align: center;
        text-shadow: 2px 2px var(--shadow);
      }
      .eyebrow {
        color: var(--dim);
        font: 14px/1.5 var(--pix);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin: 0 0 12px;
      }
      .focus-caption p {
        font-size: 20px;
        margin: 8px 0;
      }
      .project-card {
        position: absolute;
        right: 28px;
        top: 88px;
        bottom: 28px;
        width: min(480px, 46vw);
        display: flex;
        flex-direction: column;
        color: var(--paper-ink);
        background:
          repeating-linear-gradient(0deg, transparent 0 5px, #8c754c06 5px 6px), var(--paper);
        border: 0;
        box-shadow:
          4px 0 var(--paper-edge),
          -4px 0 var(--paper-edge),
          0 -4px var(--paper-edge),
          0 4px var(--paper-edge),
          8px 4px #544b36,
          4px 8px #544b36,
          10px 10px #020a0966;
        animation: reveal 0.3s ease-out;
      }
      .project-card::before {
        content: "";
        position: absolute;
        pointer-events: none;
        top: 0;
        bottom: 0;
        left: 14px;
        width: 1px;
        background: #aa806955;
      }
      .project-card::after {
        content: "";
        position: absolute;
        pointer-events: none;
        top: 20px;
        bottom: 20px;
        left: 4px;
        width: 4px;
        background: repeating-linear-gradient(
          0deg,
          transparent 0 24px,
          #9d8a653f 24px 28px,
          transparent 28px 32px
        );
      }
      .card-scroll {
        overflow: auto;
        overscroll-behavior: contain;
        padding: 24px 28px 28px 32px;
        flex: 1;
        min-height: 0;
        scrollbar-color: var(--paper-edge) var(--paper);
      }
      .journal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding-bottom: 16px;
        margin-bottom: 24px;
        border-bottom: 2px solid var(--paper-rule);
      }
      .journal-brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .journal-brand span {
        font-size: 14px;
        line-height: 1.2;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      #koi-emblem {
        width: 80px;
        height: 48px;
        image-rendering: pixelated;
        flex-shrink: 0;
      }
      .entry-tab {
        background: var(--paper-ink);
        color: var(--paper);
        padding: 8px;
        font-size: 13px;
        white-space: nowrap;
        box-shadow: 3px 3px var(--paper-edge);
      }
      .project-card .eyebrow {
        color: var(--paper-dim);
        font-size: 13px;
        letter-spacing: 0.05em;
      }
      .project-card h2 {
        font-size: clamp(28px, 3vw, 36px);
        line-height: 1.1;
        font-weight: 600;
        margin: 0 0 16px;
        overflow-wrap: anywhere;
      }
      .project-card .summary,
      .project-card dl,
      .project-card .detail,
      .project-card .project-links {
        font: 18px/1.65 var(--pix);
        font-weight: 400;
      }
      .project-card :focus-visible {
        outline: 3px solid #295e50;
        outline-offset: 3px;
      }
      .summary {
        margin: 0 0 20px;
      }
      .project-card dl {
        margin: 24px 0;
        display: grid;
        gap: 16px;
      }
      .project-card dt {
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--paper-dim);
      }
      .project-card dd {
        margin: 3px 0 0;
      }
      .detail {
        padding-top: 20px;
        border-top: 1px solid var(--paper-rule);
        margin: 0;
      }
      .screenshot-placeholder {
        position: relative;
        aspect-ratio: 16/9;
        display: grid;
        place-content: center;
        text-align: center;
        border: 8px solid #fff8e6;
        outline: 1px solid #c6b58d;
        background: #ded5bb;
        color: var(--paper-dim);
        gap: 8px;
        padding: 16px;
        box-shadow: 3px 4px #b4a17a55;
      }
      .screenshot-placeholder span {
        font-size: 20px;
        color: var(--paper-ink);
      }
      .screenshot-placeholder small {
        font: 14px/1.5 var(--pix);
      }
      .photo-corner {
        position: absolute;
        width: 16px;
        height: 16px;
        border: 0 solid #89724c;
        pointer-events: none;
      }
      .photo-corner:nth-of-type(1) {
        top: -10px;
        left: -10px;
        border-top-width: 5px;
        border-left-width: 5px;
      }
      .photo-corner:nth-of-type(2) {
        top: -10px;
        right: -10px;
        border-top-width: 5px;
        border-right-width: 5px;
      }
      .photo-corner:nth-of-type(3) {
        bottom: -10px;
        left: -10px;
        border-bottom-width: 5px;
        border-left-width: 5px;
      }
      .photo-corner:nth-of-type(4) {
        bottom: -10px;
        right: -10px;
        border-bottom-width: 5px;
        border-right-width: 5px;
      }
      .project-links {
        display: flex;
        gap: 16px;
        margin-top: 20px;
      }
      .project-links a {
        color: var(--paper-ink);
        text-underline-offset: 4px;
      }
      .project-navigation {
        padding: 12px 20px 12px 28px;
        border-top: 1px solid var(--paper-rule);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        background: #e9dab7;
      }
      .project-navigation button {
        position: relative;
        color: var(--paper-ink);
        background: transparent;
        border: 0;
        border-bottom: 2px solid var(--paper-rule);
        padding: 10px 8px;
        font-size: 16px;
      }
      .project-navigation button:hover {
        background: #dbc79d;
        border-color: var(--paper-ink);
      }
      #previous::before,
      #next::after {
        content: "";
        display: inline-block;
        border: 5px solid transparent;
        vertical-align: 0;
      }
      #previous::before {
        border-right-color: currentColor;
        margin-right: 8px;
        border-left: 0;
      }
      #next::after {
        border-left-color: currentColor;
        margin-left: 8px;
        border-right: 0;
      }
      .project-count {
        color: var(--paper-dim);
        font-size: 14px;
        white-space: nowrap;
      }
      body.project-open .hdr,
      body.project-open .hint,
      body.project-open .project-picker {
        visibility: hidden;
      }
      @keyframes reveal {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      body.calm .project-card {
        animation: none;
      }
      body.calm .hint,
      body.calm #tip {
        transition: none;
      }
      @media (max-width: 700px) {
        .hdr {
          padding: 20px 16px;
        }
        .hdr p {
          max-width: 230px;
          line-height: 1.4;
        }
        .journal-trigger {
          left: -32px;
          bottom: -126px;
          width: 188px;
          height: 220px;
        }
        .cover-bookmark {
          font-size: 16px;
          padding: 10px 14px;
        }
        .cover-emblem {
          left: 62px;
          top: 62px;
          width: 64px;
          height: 38px;
        }
        .pocket-sheet {
          left: 16px;
          bottom: calc(108px + env(safe-area-inset-bottom));
          width: calc(100vw - 32px);
          max-height: calc(100dvh - 184px - env(safe-area-inset-bottom));
        }
        .notebook-heading {
          padding: 12px 12px 10px 24px;
        }
        .notebook-heading h2 {
          font-size: 20px;
        }
        .notebook-heading small {
          font-size: 10px;
          letter-spacing: 0.04em;
        }
        .notebook-heading button {
          font-size: 12px;
          padding: 6px;
          white-space: nowrap;
        }
        .notebook-entries {
          padding: 6px 10px 6px 22px;
        }
        .index-choice {
          font-size: 15px;
          gap: 6px;
          min-height: 50px;
        }
        .index-choice canvas {
          width: 40px;
          height: 24px;
        }
        .field-note {
          padding: 10px 14px 10px 24px;
          font-size: 12px;
        }
        .motion-control {
          right: 16px;
          top: 106px;
          font-size: 12px;
          padding: 6px;
          gap: 6px;
          min-height: 44px;
        }
        .water-mark {
          width: 18px;
          height: 12px;
        }
        .motion-state {
          font-size: 11px;
          padding: 3px;
        }
        body.project-open .motion-control {
          top: 12px;
        }
        body.index-open .motion-control {
          top: 12px;
        }
        body.index-open .hdr {
          visibility: hidden;
        }
        .back-button {
          left: 16px;
          top: 12px;
          font-size: 14px;
          padding: 8px;
        }
        .back-arrow {
          width: 10px;
          margin-right: 6px;
        }
        .project-card {
          left: 16px;
          right: 16px;
          top: clamp(180px, 34dvh, 280px);

          }
        el.inert = offscreen || covered;
        el.tabIndex = el.inert ? -1 : 0;
        el.setAttribute("aria-hidden", String(el.inert));
        el.style.visibility = offscreen ? "hidden" : "visible";
      }
      function projectPondObjects() {
        const scale = PXS * camera.z,
          dx = (dockWorld.x * camera.z + camera.x) * PXS,
          dy = (dockWorld.y * camera.z + camera.y) * PXS;
        const dock = $("about-dock");
        placeWorldObject(dock, dx, dy, dockWorld.width * scale, dockWorld.height * scale);
        const artW = boat.artWidth * scale,
          artH = boat.artHeight * scale,
          hitW = Math.max(44, artW),
          hitH = Math.max(44, artH);
        const el = $("contact-boat");
        el.hidden = !boat.initialized;
        el.style.setProperty("--boat-art-width", artW + "px");
        el.style.setProperty("--boat-art-height", artH + "px");
        placeWorldObject(
          el,
          (boat.x * camera.z + camera.x) * PXS - hitW / 2,
          (boat.y * camera.z + camera.y) * PXS - hitH / 2,
          hitW,
          hitH,
        );
        if (pendingObjectFocus && !camera.from && bookState === "closed" && !aboutOpen) {
          const opener = pendingObjectFocus;
          pendingObjectFocus = null;
          (opener.isConnected && !opener.inert && !opener.hidden
            ? opener
            : $("index-toggle")
          ).focus({ preventScroll: true });
        }
      }
      function restorePondFocus(opener) {
        pendingObjectFocus = opener || $("index-toggle");
        projectPondObjects();
      }
      function updateBoat(dt) {
        if (boat.layoutDirty) scanBoatWater();
        const el = $("contact-boat"),
          paused = reduce || boat.held || el.matches(":hover,:focus") || pendingObjectFocus === el;
        if (boat.initialized && boat.free.length && !paused) {
          boat.pause = Math.max(0, boat.pause - dt);
          if (!boat.target || !boatClear(boat.target.x, boat.target.y)) {
            const candidates = boat.free.filter(
              (p) => Math.hypot(p.x - boat.x, p.y - boat.y) > 65 / PXS,
            );
            boat.target = (candidates.length ? candidates : boat.free)[
              Math.floor(Math.random() * (candidates.length || boat.free.length))
            ];
          }
          if (boat.target && boat.pause === 0) {
            const dx = boat.target.x - boat.x,
              dy = boat.target.y - boat.y;
            if (Math.hypot(dx, dy) < 12 / PXS) {
              boat.target = null;
              boat.pause = 2 + Math.random() * 3;
            } else {
              boat.a += angDiff(Math.atan2(dy, dx), boat.a) * Math.min(1, dt * BOAT.turnRate);
              const nx = boat.x + Math.cos(boat.a) * BOAT.speed * dt,
                ny = boat.y + Math.sin(boat.a) * BOAT.speed * dt;
              if (boatClear(nx, ny)) {
                boat.x = nx;
                boat.y = ny;
              } else {
                boat.a += dt * 2;
                boat.target = null;
              }
            }
          }
        }
        projectPondObjects();
      }
      $("about-dock").addEventListener("click", (e) => openAbout(e.currentTarget));
      $("contact-boat").addEventListener("click", (e) => openPersonal("contact", e.currentTarget));
      $("contact-boat").addEventListener("pointerdown", () => (boat.held = true));
      addEventListener("pointerup", () => (boat.held = false));
      addEventListener("pointercancel", () => (boat.held = false));
      drawBoat();
      drawDock();
      captureCloudSprite("boat-art");
      captureCloudSprite("dock-art");
      function closeProject() {
        if (bookState === "closed") return;
        releaseKoi();
        document.body.classList.remove("project-open");
        setCamera({ x: 0, y: 0, z: 1, shade: 0 });
        moveBook(false);
      }
      /* Accessibility: one motion policy for simulation, transitions, and click reactions. */
      function setReducedMotion(value) {
        if (value) {
          aboutAnimation?.cancel();
          if (!aboutOpen && !aboutBoard.hidden) closeAbout(true, true);
        }
        resetWake();
        reduce = value;
        document.body.classList.toggle("calm", reduce);
        $("motion").setAttribute("aria-pressed", String(reduce));
        $("motion-state").textContent = reduce ? "On" : "Off";
        if (reduce) {
          clearReactions();
          hA?.fill(0);
          hB?.fill(0);
          pend.length = 0;
          pageTurn?.cancel();
          leafTurn?.cancel();
          if (bookState === "opening" || bookState === "closing") {
            travelVersion++;
            settleBook(bookState === "opening");
          }
        }
        if (selected) prepareFocus(true);
        else if (camera.to) setCamera(camera.to, true);
      }
      renderEmblem(PROJECTS[0], $("cover-emblem"));
      renderEmblem(PROJECTS[0], $("moving-emblem"));
      $("index-toggle").addEventListener("click", openIndex);
      $("close-journal").addEventListener("click", closeProject);
      $("contents").addEventListener("click", () => {
        showPage(0);
        $("page-title").focus({ preventScroll: true });
      });
      $("previous").addEventListener("click", () => showPage(pageIndex - 1));
      $("next").addEventListener("click", () => showPage(pageIndex + 1));
      book.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          e.preventDefault();
          e.stopPropagation();
          closeProject();
        } else if (
          journalSection === "projects" &&
          (e.key === "ArrowLeft" || e.key === "ArrowRight") &&
          !e.target.closest("button,input,select,textarea,a")
        ) {
          e.preventDefault();
          showPage(
            Math.max(pageIndex === 0 ? 0 : 1, pageIndex + (e.key === "ArrowRight" ? 1 : -1)),
          );
        }
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && aboutOpen) {
          e.preventDefault();
          closeAbout();
          return;
        }
        if (e.key === "Escape" && bookState !== "closed") {
          e.preventDefault();
          closeProject();
        }
      });
      $("motion").addEventListener("click", () => setReducedMotion(!reduce));
      $("motion").addEventListener("pointerenter", () => {
        padHovered = true;
        showTip(null);
      });
      $("motion").addEventListener("pointerleave", () => (padHovered = false));
      $("motion").addEventListener("focus", () => (padFocused = true));
      $("motion").addEventListener("blur", () => (padFocused = false));
      $("motion").addEventListener("pointerdown", () => (padHeld = true));
      addEventListener("pointerup", () => (padHeld = false));
      addEventListener("pointercancel", () => (padHeld = false));
      addEventListener("pointerup", () => $("motion").classList.remove("held"));
      addEventListener("pointercancel", () => $("motion").classList.remove("held"));
      motionQuery.addEventListener("change", (e) => setReducedMotion(e.matches));
      function repaginate() {
        // Natural scroll layout preserves the current project and reading position.
        if (bookState === "opening" || bookState === "closing") {
          const open = bookState === "opening";
          travelVersion++;
          settleBook(open);
        }
      }

      document.fonts.ready.then(repaginate);
      /* ===== 9. Input, layout, main loop ===== */
      function resize() {
        resetWake();
        const vw = innerWidth,
          vh = innerHeight,
          ow = W,
          oh = H,
          oldU = U;
        PXS = vw < 600 ? 2 : Math.max(3, Math.round(vw / CONFIG.pxTarget)); // CSS pixels per art pixel (whole numbers stay crisp)
        W = cv.width = Math.ceil(vw / PXS);
        H = cv.height = Math.ceil(vh / PXS);
        scene.width = W;
        scene.height = H;
        cv.style.width = W * PXS + "px";
        cv.style.height = H * PXS + "px";
        U = Math.max(0.75, Math.min(1.3, Math.min(W, H * 1.7) / 340));
        if (boat.initialized && ow && oh) {
          boat.x *= W / ow;
          boat.y *= H / oh;
          if (boat.target) {
            boat.target = {
              x: (boat.target.x * W) / ow,
              y: (boat.target.y * H) / oh,
            };
          }
        }
        scalePondObjects();
        buf = new Uint32Array(W * H);
        img = new ImageData(new Uint8ClampedArray(buf.buffer), W, H);
        stamp = new Uint32Array(W * H);
        hA = new Float32Array(W * H);
        hB = new Float32Array(W * H);
        buildCloudField();
        updateCloudField(0);
        buildWater();
        buildScene();
        ecosystemResize(ow, oh);
        pads[MOTION_PAD].R = Math.round(30 / PXS);
        pads[MOTION_PAD].s = makePad(pads[MOTION_PAD].R, MOTION_PAD * 31 + 7);
        if (!koi.length) PROJECTS.forEach((p, i) => koi.push(makeKoi(p, i)));
        else
          koi.forEach((k) => {
            // Reposition each fish for the new aspect ratio without stretching its body.
            const h = { ...k.pts[0] },
              nx = (h.x * W) / ow,
              ny = (h.y * H) / oh,
              scale = U / oldU;
            k.pts.forEach((q) => {
              q.x = nx + (q.x - h.x) * scale;
              q.y = ny + (q.y - h.y) * scale;
            });
            containKoi(k);
            k.rt.wp = null;
            if (k.reaction) {
              k.reaction.x = clamp((k.reaction.x * W) / ow, koiClearance(k), W - koiClearance(k));
              k.reaction.y = clamp((k.reaction.y * H) / oh, koiClearance(k), H - koiClearance(k));
            }
          });
        if (ow) {
          camera.x *= W / ow;
          camera.y *= H / oh;
        }
        if (selected) prepareFocus(true);
        else setCamera({ x: 0, y: 0, z: 1, shade: 0 }, true);
        updateBoat(0);
        repaginate();
      }
      function showTip(k, cx, cy) {
        if (!k) {
          tip.classList.remove("on");
          tip.replaceChildren();
          return;
        }
        tip.replaceChildren(document.createTextNode(k.name));
        const small = document.createElement("small");
        small.textContent = "View project";
        tip.append(small);
        tip.classList.add("on");
        tip.style.left = Math.min(cx + 14, innerWidth - tip.offsetWidth - 8) + "px";
        tip.style.top = Math.min(cy + 16, innerHeight - 52) + "px";
      }
      const art = (e) => [
        (e.clientX / PXS - camera.x) / camera.z,
        (e.clientY / PXS - camera.y) / camera.z,
      ];
      // A fixed-size input queue preserves bends without allocating on pointer movement.
      const wakePoints = new Float32Array(64 * 3);
      let wakeCount = 0,
        wakeX = 0,
        wakeY = 0,
        wakeTime = 0,
        wakeActive = false,
        wakeBudget = 0;
      function resetWake() {
        wakeCount = 0;
        wakeActive = false;
        wakeBudget = 0;
      }
      function recordWake(x, y, time, pointerType) {
        if (reduce || pointerType === "touch") {
          resetWake();
          return;
        }
        if (!wakeActive || time - wakeTime > 180) {
          wakeX = x;
          wakeY = y;
          wakeTime = time;
          wakeActive = true;
          wakeCount = 0;
          return;
        }
        const distance = Math.hypot(x - wakeX, y - wakeY);
        if (distance < 0.5) return;
        const speed = (distance / Math.max(8, time - wakeTime)) * 1000;
        // Keep the first point of each queued path, including direction changes.
        if (!wakeCount) {
          wakePoints[0] = wakeX;
          wakePoints[1] = wakeY;
          wakePoints[2] = RIPPLE.strength;
          wakeCount = 1;
        }
        const slot = Math.min(wakeCount, 63) * 3;
        wakePoints[slot] = x;
        wakePoints[slot + 1] = y;
        wakePoints[slot + 2] = Math.min(
          RIPPLE.maxStrength,
          RIPPLE.strength + speed * RIPPLE.speedGain,
        );
        wakeCount = Math.min(64, wakeCount + 1);
        wakeX = x;
        wakeY = y;
        wakeTime = time;
      }
      function flushWake(dt) {
        if (reduce) {
          resetWake();
          return;
        }
        wakeBudget = Math.min(1, wakeBudget + dt * RIPPLE.maxInputRate);
        if (wakeBudget < 1 || wakeCount < 2) return;
        wakeBudget = 0;
        let total = 0;
        for (let j = 1; j < wakeCount; j++)
          total += Math.hypot(
            wakePoints[j * 3] - wakePoints[(j - 1) * 3],
            wakePoints[j * 3 + 1] - wakePoints[(j - 1) * 3 + 1],
          );
        const spacing = Math.max(
          RIPPLE.trailSpacing * PXS * camera.z,
          total / Math.max(1, RIPPLE.maxTrailSamples - wakeCount),
        );
        for (let j = 1; j < wakeCount; j++) {
          const a = (j - 1) * 3,
            b = j * 3,
            dx = wakePoints[b] - wakePoints[a],
            dy = wakePoints[b + 1] - wakePoints[a + 1],
            distance = Math.hypot(dx, dy),
            steps = Math.max(1, Math.ceil(distance / spacing));
          // Weight by distance so high-frequency tiny movements cannot build large waves.
          const strength = wakePoints[b + 2] * Math.min(1, distance / (steps * spacing));
          for (let k = 1; k <= steps; k++) {
            const t = k / steps;
            splat(
              ((wakePoints[a] + dx * t) / PXS - camera.x) / camera.z,
              ((wakePoints[a + 1] + dy * t) / PXS - camera.y) / camera.z,
              strength,
            );
          }
        }
        wakeCount = 0;
      }
      cv.addEventListener("pointermove", (e) => {
        const [x, y] = art(e);
        recordWake(e.clientX, e.clientY, e.timeStamp, e.pointerType);
        if (selected) return;
        hover = e.pointerType === "touch" ? null : pick(x, y);
        koi.forEach((k) => (k.hov = k === hover));
        showTip(hover, e.clientX, e.clientY);
      });
      cv.addEventListener("pointerleave", () => {
        resetWake();
        hover = null;
        koi.forEach((k) => (k.hov = false));
        showTip(null);
      });
      cv.addEventListener("pointercancel", resetWake);
      cv.addEventListener("click", (e) => {
        const [x, y] = art(e);
        const hit = pick(x, y);
        if (hit) {
          if (hit !== selected) openProject(hit);
          return;
        }
        if (reduce) return;
        reactToWater(x, y);
        pend.length = 0; // A fresh click replaces pending ripple beats, never an unbounded queue.
        [
          [0, 170],
          [0.18, -110],
          [0.36, 90],
        ].forEach(([d, a]) => pend.push({ t: d, x, y, a }));
        hint.classList.add("done");
        if (e.pointerType === "touch") {
          showTip(pick(x, y), e.clientX, e.clientY);
          clearTimeout(tipT);
          tipT = setTimeout(() => showTip(null), 1800);
        }
      });
      let rz;
      addEventListener("resize", () => {
        clearTimeout(rz);
        rz = setTimeout(resize, 120);
      });
      let last = performance.now(),
        frameId = 0;
      function frame(now) {
        if (document.hidden) {
          frameId = 0;
          return;
        }
        const dt = Math.min(0.05, (now - last) / 1000);
        last = now;
        step(dt);
        draw();
        frameId = requestAnimationFrame(frame);
      }
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          cancelAnimationFrame(frameId);
          frameId = 0;
        } else if (!frameId) {
          last = performance.now();
          frameId = requestAnimationFrame(frame);
        }
      });
      /* Initialization: populate identity, build the scene, apply system motion preference, then animate. */
      $("nm").textContent = CONFIG.name;
      $("tg").textContent = CONFIG.tagline;
      document.title = CONFIG.name + " · Portfolio";
      resize();
      setReducedMotion(reduce);
      frameId = requestAnimationFrame(frame);
    </script>
  </body>
</html>
