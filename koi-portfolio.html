<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Yuri Ante · Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/pond.css" />
  </head>
  <body>
    <canvas
      id="pond"
      role="img"
      aria-label="Interactive pixel-art koi pond. Click a koi to view its project, or click water to startle nearby fish and draw the koi back. Use the project picker for keyboard access."
    ></canvas>
    <header class="hdr"><h1 id="nm"></h1><p id="tg"></p></header>
    <div id="tip" role="status"></div>
    <button
      class="motion-control"
      id="motion"
      type="button"
      aria-pressed="false"
      aria-label="Still water — reduce motion"
      aria-describedby="pad-hint"
      ><span class="pad-label">Still water: <span id="motion-state">Off</span></span></button
    >
    <span id="pad-hint">Marked pad · pause motion</span>
    <button
      id="about-dock"
      class="garden-object"
      type="button"
      aria-label="About Yuri"
      aria-controls="about-board"
      aria-expanded="false"
      ><canvas id="dock-art" width="48" height="108" aria-hidden="true"></canvas
      ><span class="dock-name">About Yuri</span></button
    >
    <section id="about-board" aria-labelledby="about-title" hidden inert
      ><header
        ><div><p>Notes from the dock</p><h2 id="about-title" tabindex="-1">About Yuri</h2></div
        ><button id="about-back" type="button">Back to pond</button></header
      ><div id="about-content" tabindex="0" role="region" aria-label="About Yuri information"></div
      ><footer
        ><span class="resume-roll" aria-hidden="true"></span
        ><a class="paper-link" href="assets/yuri-ante-resume-public.pdf" download="Yuri-Ante-Resume-Public.pdf"
          >Download résumé</a
        ></footer
      ></section
    >
    <button
      id="contact-boat"
      class="garden-object"
      type="button"
      aria-label="Contact Yuri"
      aria-controls="book"
      ><canvas id="boat-art" width="56" height="44" aria-hidden="true"></canvas
      ><span class="boat-label">Contact</span></button
    >
    <div class="project-picker" id="picker">
      <button
        class="journal-trigger"
        id="index-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="book"
        aria-label="Open project journal"
        ><span class="cover-bookmark">Projects</span
        ><canvas
          class="cover-emblem"
          id="cover-emblem"
          width="80"
          height="48"
          aria-hidden="true"
        ></canvas
        ><span class="cover-title" aria-hidden="true">POND<br />FIELD NOTES</span></button
      >
      <section id="book" aria-labelledby="page-title" hidden inert>
        <div id="book-cover" aria-hidden="true"
          ><span class="cover-bookmark">Projects</span
          ><canvas id="moving-emblem" width="80" height="48"></canvas
          ><span>POND<br />FIELD NOTES</span></div
        >
        <header class="book-heading"
          ><div
            ><div class="book-label"
              ><canvas id="page-emblem" width="80" height="48" aria-hidden="true"></canvas
              ><p id="page-kicker"></p></div
            ><h2 id="page-title" tabindex="-1"></h2></div
          ><button id="close-journal" type="button">Close journal</button></header
        >
        <div id="page-body" tabindex="0" role="region" aria-label="Journal content"></div>
        <div id="page-leaf" aria-hidden="true"></div>
        <footer class="book-footer"
          ><div class="book-tools"
            ><button id="contents" type="button">Contents</button
            ><span id="page-count" aria-live="off"></span></div
          ><nav aria-label="Journal pages"
            ><button id="previous" type="button">Previous project</button
            ><button id="next" type="button">Next project</button></nav
          ></footer
        >
      </section>
    </div>
    <p class="sr" id="hint"
      >Choose a koi to open its story. Tap water: nearby fish scatter, then koi return.</p
    >
    <div id="announcement" class="sr" role="status" aria-live="polite"></div>
    <noscript>This portfolio is an interactive pond and needs JavaScript.</noscript>
    <script src="scripts/pond.js"></script>
  </body>
</html>
